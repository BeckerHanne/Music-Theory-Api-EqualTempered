openapi: 3.0.3
info:
  title: Music Theory API
  description: |
    A REST API that answers music theory questions programmatically —
    scales, chords, intervals, and Roman numeral analysis served as
    clean, well-documented JSON.

    **Important caveat:** This API models music theory within the 12-tone
    equal temperament system. It does not capture the full complexity of
    Western music's historical and improvisatory traditions. Historical
    tuning system support (Pythagorean, meantone, well temperament) is
    planned for a future version.
  version: 1.0.0
servers:
  - url: /api
    description: API base URL

components:
  schemas:
    Scale:
      type: object
      properties:
        tonic:
          type: string
          description: The root note of the scale
          example: "F#"
        mode:
          type: string
          description: The mode or scale type
          example: "major"
        scale:
          type: array
          items:
            type: string
          description: |
            The notes of the scale in ascending order, spelled correctly
            according to music theory conventions. For example, F# major
            returns E# (not F) as the seventh degree.
          example: ["F#", "G#", "A#", "B", "C#", "D#", "E#"]
    Error:
      type: object
      properties:
        error:
          type: string
          description: A description of the error
          example: "Invalid tonic: Z"

    Interval:
      type: object
      properties:
        note1:
          type: string
          description: The ground note (lower boundary of the interval)
          example: "A"
        note2:
          type: string
          description: The interval-determining note (measured upward from note1)
          example: "C"
        diatonic_interval:
          type: integer
          description: The interval number (1=unison, 2=second ... 7=seventh)
          example: 3
        semitones:
          type: integer
          description: The number of semitones between the two notes
          example: 3
        quality:
          type: string
          description: The interval quality
          enum: [perfect, major, minor, augmented, diminished]
          example: "minor"
        name:
          type: string
          description: The full interval name
          example: "minor third"
        inversion:
          type: string
          description: The name of the intervallic inversion (interval + inversion always sum to 9)
          example: "major sixth"

    Triad:
      type: object
      properties:
        root:
          type: string
          description: The root note of the chord
          example: "C"
        quality:
          type: string
          description: The chord quality
          enum: [maj, min, dim, aug]
          example: "min"
        name:
          type: string
          description: The full chord name
          example: "C minor"
        inversion:
          type: string
          description: The inversion of the chord
          enum: [root position, first inversion, second inversion]
          example: "first inversion"
        bass:
          type: string
          description: The bass note (lowest note) of the chord
          example: "Eb"
        notes:
          type: array
          items:
            type: string
          description: The notes of the chord in order from bass upward
          example: ["Eb", "G", "C"]
        intervals_above_bass:
          type: array
          items:
            type: string
          description: Intervals measured upward from the bass note
          example: ["major third", "major sixth"]


    Seventh:
      type: object
      properties:
        root:
          type: string
          description: The root note of the chord
          example: "G"
        quality:
          type: string
          description: The chord quality
          enum: [dominant7th, major7th, minor7th, half_diminished7th, diminished7th, minor_major7th]
          example: "dominant7th"
        name:
          type: string
          description: The full chord name
          example: "G dominant seventh"
        inversion:
          type: string
          description: The inversion of the chord
          enum: [root position, first inversion, second inversion, third inversion]
          example: "root position"
        bass:
          type: string
          description: The bass note (lowest note) of the chord
          example: "G"
        notes:
          type: array
          items:
            type: string
          description: The notes of the chord in order from bass upward
          example: ["G", "B", "D", "F"]
        intervals_above_bass:
          type: array
          items:
            type: string
          description: Intervals measured upward from the bass note
          example: ["major third", "perfect fifth", "minor seventh"]

    DiatonicChords:
      type: object
      properties:
        tonic:
          type: string
          description: The tonic note of the key
          example: "C"
        mode:
          type: string
          description: The mode of the key
          example: "major"
        triads:
          type: array
          items:
            type: object
            properties:
              degree:
                type: string
                description: The Roman numeral scale degree
                example: "V"
              root:
                type: string
                description: The root note of the chord
                example: "G"
              quality:
                type: string
                description: The chord quality
                example: "major"
              notes:
                type: array
                items:
                  type: string
                description: The notes of the chord
                example: ["G", "B", "D"]
        seventh_chords:
          type: array
          items:
            type: object
            properties:
              degree:
                type: string
                description: The Roman numeral scale degree with seventh chord symbol
                example: "V7"
              root:
                type: string
                description: The root note of the chord
                example: "G"
              quality:
                type: string
                description: The chord quality
                example: "dominant seventh"
              notes:
                type: array
                items:
                  type: string
                description: The notes of the chord
                example: ["G", "B", "D", "F"]


paths:
  /scales/{tonic}/{mode}:
    get:
      summary: Get a scale
      description: |
        Returns the notes of a scale given a tonic and mode, with correct
        enharmonic spelling. 

        Tonics in this API inputs need to use German music notation to overcome shortcomings in SwaggerUI URL encodings for # symbols:
        - Natural notes are: C, D, E, F, G, A, H
        - Sharps use the suffix "is" : Cis, Dis, Eis, Fis, Gis, Ais, His
        - Flats use the suffix "es" : Des, Es, Ges, As, Ces
        - Note the **two exceptions** at English note designated B is H in German, and Bb is denoted B in German.

        Output in JSON will be in English notation, with B and Bb spelled as B and Bb respectively.

        Supported modes: major, natural_minor, harmonic_minor
      tags:
        - Scales
      parameters:
        - name: tonic
          in: path
          required: true
          schema:
            type: string
          description: |
            The root note of the scale using German music notation.
            Sharps use the suffix "is" (e.g., "Fis" for F#), and flats use the suffix "es" (e.g., "Es" for Eb). 
            Note the exeptions at English letter B (H in German) and Bb (B in German)!!
          example: "Fis"
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [major, natural_minor, harmonic_minor]
          description: The mode or scale type
          example: "major"
      responses:
        "200":
          description: Scale retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scale"
        "400":
          description: Invalid tonic or unsupported mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /intervals/{note1}/{note2}:
    get:
      summary: Get the interval between two notes
      description: |
        Returns the interval between two notes, measured upward from `note1`
        to `note2`. `note1` is the ground note; `note2` is the interval-determining
        note. Input order is meaningful: A→C returns a minor third, while C→A
        returns a major sixth.

        Enharmonically equivalent notes return different results depending
        on their spelling: C→F# returns an augmented fourth, C→Gb returns
        a diminished fifth.

        Inputs use German notation (same convention as the scales endpoint):
        - Sharps use the suffix "is": Fis, Cis, Gis
        - Flats use the suffix "es": Es, Ges, As
        - B natural = H, Bb = B

        Output is in English notation.
      tags:
        - Intervals
      parameters:
        - name: note1
          in: path
          required: true
          schema:
            type: string
          description: |
            The ground note, using German notation.
          example: "A"
        - name: note2
          in: path
          required: true
          schema:
            type: string
          description: |
            The interval-determining note, measured upward from note1.
            Using German notation.
          example: "C"
      responses:
        "200":
          description: Interval retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interval"
        "400":
          description: Invalid note name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chords/triads/{root}/{quality}:
    get:
      summary: Get a triad
      description: |
        Returns the notes, intervals, and figured bass notation for a triad
        given a root note and quality, with an optional inversion parameter.

        Inputs use German notation (same convention as the scales endpoint):
        - Sharps use the suffix "is": Fis, Cis, Gis
        - Flats use the suffix "es": Es, Ges, As
        - B natural = H, Bb = B

        Output is in English notation.
      tags:
        - Chords
      parameters:
        - name: root
          in: path
          required: true
          schema:
            type: string
          description: The root note of the chord in German notation
          example: "C"
        - name: quality
          in: path
          required: true
          schema:
            type: string
            enum: [maj, min, dim, aug]
          description: The chord quality
          example: "min"
        - name: inversion
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
            default: 0
          description: |
            The inversion of the chord.
            0 = root position (default)
            1 = first inversion
            2 = second inversion
          example: 0
      responses:
        "200":
          description: Triad retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Triad"
        "400":
          description: Invalid root, quality, or inversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chords/seventh/{root}/{quality}:
    get:
      summary: Get a seventh chord
      description: |
        Returns the notes, intervals, and figured bass notation for a seventh
        chord given a root note and quality, with an optional inversion parameter.

        Inputs use German notation (same convention as the scales endpoint):
        - Sharps use the suffix "is": Fis, Cis, Gis
        - Flats use the suffix "es": Es, Ges, As
        - B natural = H, Bb = B

        Output is in English notation.
      tags:
        - Chords
      parameters:
        - name: root
          in: path
          required: true
          schema:
            type: string
          description: The root note of the chord in German notation
          example: "G"
        - name: quality
          in: path
          required: true
          schema:
            type: string
            enum: [dominant7th, major7th, minor7th, half_diminished7th, diminished7th, minor_major7th]
          description: The chord quality
          example: "dominant7th"
        - name: inversion
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2, 3]
            default: 0
          description: |
            The inversion of the chord.
            0 = root position (default)
            1 = first inversion
            2 = second inversion
            3 = third inversion
          example: 0
      responses:
        "200":
          description: Seventh chord retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seventh"
        "400":
          description: Invalid root, quality, or inversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /key/{tonic}/{mode}/chords:
    get:
      summary: Get diatonic chords for a key
      description: |
        Returns all diatonic triads and seventh chords for a given tonic and
        mode, with Roman numeral degree labels.

        Supported modes: major, harmonic_minor

        Inputs use German notation (same convention as the scales endpoint):
        - Sharps use the suffix "is": Fis, Cis, Gis
        - Flats use the suffix "es": Es, Ges, As
        - B natural = H, Bb = B

        Output is in English notation.
      tags:
        - Keys
      parameters:
        - name: tonic
          in: path
          required: true
          schema:
            type: string
          description: The tonic note of the key in German notation
          example: "C"
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum: [major, harmonic_minor]
          description: The mode of the key
          example: "major"
      responses:
        "200":
          description: Diatonic chords retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiatonicChords"
        "400":
          description: Invalid tonic or unsupported mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"